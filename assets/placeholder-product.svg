<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF8F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0EBE0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#grad1)"/>

  <!-- Jar Body -->
  <ellipse cx="200" cy="120" rx="60" ry="20" fill="#D4AF37" opacity="0.8"/>
  <path d="M 150 120 L 140 350 Q 140 370 160 370 L 240 370 Q 260 370 260 350 L 250 120" fill="#FAF8F3" stroke="#C41E3A" stroke-width="2"/>

  <!-- Jar Content -->
  <path d="M 145 200 L 140 350 Q 140 365 160 365 L 240 365 Q 260 365 260 350 L 255 200" fill="#C41E3A" opacity="0.4"/>

  <!-- Jar Highlight -->
  <path d="M 155 130 L 155 300" stroke="white" stroke-width="4" opacity="0.3"/>

  <!-- Jar Lid -->
  <rect x="170" y="100" width="60" height="25" rx="3" fill="#D4AF37"/>
  <rect x="168" y="123" width="64" height="4" fill="#C41E3A" opacity="0.2"/>

  <!-- Decorative Elements in jar -->
  <circle cx="170" cy="250" r="3" fill="#D4AF37" opacity="0.6"/>
  <circle cx="200" cy="270" r="3" fill="#D4AF37" opacity="0.6"/>
  <circle cx="230" cy="240" r="3" fill="#D4AF37" opacity="0.6"/>
  <circle cx="180" cy="310" r="2" fill="#D4AF37" opacity="0.4"/>
  <circle cx="220" cy="300" r="2" fill="#D4AF37" opacity="0.4"/>

  <!-- Product text placeholder -->
  <text x="200" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#C41E3A">
    Product Image
  </text>
</svg>
