<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#C41E3A" stroke="#D4AF37" stroke-width="3"/>

  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#D4AF37" stroke-width="2"/>

  <!-- Sun/Rise Icon -->
  <circle cx="100" cy="70" r="15" fill="#D4AF37"/>
  <line x1="100" y1="50" x2="100" y2="35" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="125" y1="58" x2="135" y2="48" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="130" y1="83" x2="145" y2="83" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="125" y1="102" x2="135" y2="112" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="58" x2="65" y2="48" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="83" x2="55" y2="83" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="102" x2="65" y2="112" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>

  <!-- Jar Shape -->
  <path d="M 75 95 L 75 140 Q 75 150 85 150 L 115 150 Q 125 150 125 140 L 125 95 Z" fill="none" stroke="#D4AF37" stroke-width="2.5"/>

  <!-- Jar Lid -->
  <rect x="80" y="85" width="40" height="8" rx="1" fill="#D4AF37"/>
  <rect x="78" y="93" width="44" height="3" fill="#D4AF37" opacity="0.6"/>

  <!-- Jar Content - Dip pattern -->
  <path d="M 78 115 Q 85 120 100 120 Q 115 120 122 115 L 122 145 Q 122 148 120 148 L 80 148 Q 78 148 78 145 Z" fill="#D4AF37" opacity="0.3"/>

  <!-- Decorative dots in jar -->
  <circle cx="90" cy="125" r="2" fill="#D4AF37" opacity="0.8"/>
  <circle cx="100" cy="130" r="2" fill="#D4AF37" opacity="0.8"/>
  <circle cx="110" cy="127" r="2" fill="#D4AF37" opacity="0.8"/>
  <circle cx="95" cy="135" r="1.5" fill="#D4AF37" opacity="0.6"/>
  <circle cx="105" cy="135" r="1.5" fill="#D4AF37" opacity="0.6"/>

  <!-- Brand Text Arc -->
  <defs>
    <path id="topArc" d="M 40 100 A 60 60 0 0 1 160 100" fill="none"/>
  </defs>
  <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FAF8F3" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
